# Re-warm the tenant CDN cache after every production deploy.
#
# Netlify invalidates the Durable CDN cache when a new deploy goes live
# (verified 2026-07-05), so every push to main re-colds every tenant page and
# the first visitor per page pays the full 5-7s SSR re-render. This workflow
# waits for the push's Netlify deploy to be live, then crawls every active
# tenant's homepage + sitemap URLs (browser-shaped requests) so the durable
# cache is re-primed before real visitors arrive.
#
# Publishes re-warm their own tenant in-process (lib/services/cacheService.ts
# warmRoutes) — this workflow only covers the deploy-wide invalidation that
# no publish flow sees.
#
# Secrets/vars reused from existing workflows (nothing new to configure):
#   secrets.NETLIFY_AUTH_TOKEN, secrets.NETLIFY_SITE_ID (core-update-deploy-notify)
#   secrets.SUPABASE_SERVICE_ROLE_KEY, vars.PROD_SUPABASE_URL (tenant-isolation-live-check)

name: Post-deploy cache warm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A rapid series of pushes should only keep the newest warm run: each deploy
# re-colds the cache again anyway, so warming for a superseded deploy is waste.
concurrency:
  group: post-deploy-cache-warm
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/post-deploy-cache-warm.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Dependency-free script — no npm ci, so warming starts as soon as the
      # deploy is live instead of minutes later.
      - name: Wait for deploy, then warm all active tenants
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          SUPABASE_URL: ${{ vars.PROD_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/post-deploy-cache-warm.mjs
